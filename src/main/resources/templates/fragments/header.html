<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accomm</title>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background-color:#fffdf9; }
        header { display:flex; justify-content:space-between; align-items:center; padding:16px 32px; background-color:#fefcf9; }
        header a { font-size:24px; font-weight:bold; color:#b49678; text-decoration:none; }
        nav { display:flex; gap:20px; }
        nav a, nav span { text-decoration:none; color:#5c3d2e; font-size:16px; }
        .user-menu-container { position:relative; display:inline-block; }
        .profile-button { background-color:#333; color:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; }
        .dropdown-menu { position:absolute; right:0; top:50px; background:#fff; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.1); width:200px; padding:12px 0; z-index:1000; }
        .dropdown-menu a { display:block; padding:10px 20px; color:#333; text-decoration:none; }
        .dropdown-menu a:hover { background-color:#f5f5f5; }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">Accomm</a>

    <div class="user-menu-container" th:if="${session.loginUser != null}">
        <button onclick="toggleUserMenu()" class="profile-button"
                th:text="${session.loginUser?.nickname != null ? session.loginUser.nickname.substring(0,1) : '유'}">유</button>
        <div id="userDropdown" class="dropdown-menu" style="display:none;">
            <!-- 게스트 전용 -->
            <a th:if="${session.loginUser.role == 'guest'}" href="/users/mypage">예약 내역</a>
            <a th:if="${session.loginUser.role == 'guest'}" href="/users/reviews">후기</a>
            <a th:if="${session.loginUser.role == 'guest'}" href="/users/wishlist">위시리스트</a>

            <!-- 호스트 전용 -->
            <a th:if="${session.loginUser.role == 'host'}" href="/host/mypage">숙소 관리</a>
            <a th:if="${session.loginUser.role == 'host'}" href="/host/reviews">후기</a>

            <!-- 공통 -->
            <a href="/chat/messages">메시지</a>
            <a href="/logout">로그아웃</a>
        </div>
    </div>

    <nav th:unless="${session.loginUser != null}">
        <a href="/login">로그인</a>
        <a href="/register">회원가입</a>
    </nav>
</header>

<script>
    function toggleUserMenu() {
        const dropdown = document.getElementById("userDropdown");
        dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    }
    window.addEventListener("click", function(e) {
        const btn = document.querySelector(".profile-button");
        const menu = document.getElementById("userDropdown");
        if (btn && !btn.contains(e.target) && menu && !menu.contains(e.target)) {
            menu.style.display = "none";
        }
    });
</script>

</body>
</html>
