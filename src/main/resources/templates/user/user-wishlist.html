<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>위시리스트</title>

    <style>
        :root {
            --bg:#fffdf9;
            --card:#ffffff;
            --ink:#3a2f28;
            --muted:#9b8579;
            --accent:#5c3d2e;
            --soft:#e8d8ca;
            --shadow:0 8px 20px rgba(0,0,0,.06);
        }
        * { box-sizing:border-box; }

        body {
            margin:0;
            padding:32px 20px;
            background:var(--bg);
            font-family:system-ui, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color:var(--ink);
        }

        h1 {
            margin:0 0 6px 0;
            font-size:28px;
            letter-spacing:-.3px;
        }
        .subtitle {
            font-size:14px;
            color:var(--muted);
            margin-bottom:20px;
        }

        .top-actions {
            position:sticky;
            top:10px;
            float:right;
        }
        .btn {
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding:8px 14px;
            border-radius:999px;
            border:none;
            background:#c1a78a;
            color:#fff;
            font-size:13px;
            font-weight:600;
            text-decoration:none;
            box-shadow:var(--shadow);
            cursor:pointer;
        }

        /* 리스트 레이아웃 */
        .list {
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap:16px;
            margin-top:8px;
        }
        @media (max-width:1000px) {
            .list { grid-template-columns:repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width:720px) {
            body { padding:24px 14px; }
            .list { grid-template-columns:1fr; }
        }

        /* 카드 */
        .card {
            background:var(--card);
            border-radius:18px;
            box-shadow:var(--shadow);
            overflow:hidden;
            display:flex;
            flex-direction:column;
        }
        .thumb-wrap {
            position:relative;
            width:100%;
            padding-top:70%; /* 16:9-ish */
            overflow:hidden;
        }
        .thumb {
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .card-body {
            padding:12px 14px 12px;
            display:flex;
            flex-direction:column;
            gap:4px;
        }

        .name-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:6px;
        }
        .name {
            font-size:16px;
            font-weight:700;
            letter-spacing:-.2px;
            color:var(--ink);
            text-decoration:none;
        }
        .name:hover { text-decoration:underline; }

        .location {
            font-size:13px;
            color:var(--muted);
        }

        .meta-row {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:2px;
            font-size:13px;
            color:var(--muted);
        }
        .price {
            font-weight:700;
            color:var(--accent);
            font-size:15px;
        }

        /* 위시 해제 버튼(하트) */
        .wish-form {
            margin:0;
        }
        .wish-btn {
            border:none;
            background:rgba(255,255,255,.92);
            border-radius:999px;
            padding:4px 9px;
            font-size:12px;
            display:inline-flex;
            align-items:center;
            gap:4px;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,.18);
            color:#b33939;
        }

        .heart-icon{
            display:inline-flex;
            align-items:center;
            justify-content:center;
        }
        .heart-svg{
            width:16px;
            height:16px;
            stroke:#e63946;
            stroke-width:2;
            fill:#e63946;      /* 목록에서는 항상 '찜됨' 상태라 채운 하트 */
        }

        .wish-top {
            position:absolute;
            right:10px;
            top:10px;
        }

        .empty {
            padding:20px;
            margin-top:8px;
            border-radius:14px;
            border:1px dashed var(--soft);
            background:#fff;
            color:var(--muted);
            font-size:14px;
        }
        .empty strong { color:var(--accent); }
    </style>
</head>
<body>

<div class="top-actions">
    <a th:href="@{/users/mypage}" class="btn">마이페이지로</a>
</div>

<h1>위시리스트</h1>
<div class="subtitle"
     th:text="${(user.nickname != null ? user.nickname : user.name)} + '님이 찜한 숙소 목록입니다.'">
    사용자 설명
</div>

<!-- 비어 있을 때 -->
<div th:if="${#lists.isEmpty(wishlist)}" class="empty">
    아직 찜한 숙소가 없습니다. 마음에 드는 숙소를 <strong>하트 버튼</strong>으로 추가해 보세요!
</div>

<!-- 위시 리스트 카드들 -->
<div class="list" th:if="${!#lists.isEmpty(wishlist)}">

    <!-- ✅ wishlist 는 Wishlist 엔티티 리스트, 각 item 안에 accommodation 이라고 가정 -->
    <div class="card" th:each="item : ${wishlist}">
        <div class="thumb-wrap">
            <a th:href="@{/accommodations/{id}(id=${item.accommodation.id})}">
                <!-- 썸네일: accommodation.mainImageUrl 사용 (null 이면 placeholder) -->
                <img class="thumb"
                     th:if="${item.accommodation.mainImageUrl != null}"
                     th:src="@{${item.accommodation.mainImageUrl}}"
                     alt="숙소 이미지" />
                <div th:if="${item.accommodation.mainImageUrl == null}"
                     style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                            background:#eee; color:#999; font-size:13px;">
                    이미지 없음
                </div>
            </a>

            <!-- 🔁 위시 토글(해제) 버튼: /wishlist/toggle 으로 POST -->
            <div class="wish-top">
                <form class="wish-form"
                      th:action="@{/wishlist/toggle}"
                      method="post">
                    <input type="hidden" name="accommodationId" th:value="${item.accommodation.id}" />
                    <button type="submit" class="wish-btn">
                        <span class="heart-icon" aria-hidden="true">
                            <svg class="heart-svg" viewBox="0 0 24 24">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.74 0 3.41 1.01 4.22 2.53C11.09 5.01 12.76 4 14.5 4 17 4 19 6 19 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </span>
                        <span>위시 해제</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="card-body">
            <div class="name-row">
                <a th:href="@{/accommodations/{id}(id=${item.accommodation.id})}"
                   class="name"
                   th:text="${item.accommodation.name}">
                    숙소 이름
                </a>
            </div>

            <div class="location"
                 th:text="${item.accommodation.location}">
                위치
            </div>

            <div class="meta-row">
                <div>
                    <span class="price">
                        ₩<span th:text="${#numbers.formatDecimal(item.accommodation.price, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </span>
                    <span style="font-size:12px; color:var(--muted);"> /박</span>
                </div>
                <div th:text="'최대 ' + ${item.accommodation.maxGuests} + '명'"
                     style="font-size:12px;">
                    최대 0명
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
