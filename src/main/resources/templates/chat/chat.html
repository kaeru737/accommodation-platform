<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${header.accommodationName + ' - ' + header.hostName}">실시간 채팅</title>
  <style>
    :root{
      --beige:#f5e9da;
      --beige-dark:#e9dcc8;
      --text:#222;
      --ink:#111;
      --border:#eee;
      --bg:#fffdf9;
    }
    body { font-family: sans-serif; background:var(--bg); margin:0; padding:40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.06); background:#fff; }
    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .room { font-weight:700; font-size:18px; }

    .messages { height:420px; overflow-y:auto; border:1px solid #f0f0f0; border-radius:12px; padding:12px; background:#fafafa; }
    .msg { display:flex; margin:8px 0; }
    .msg.me { justify-content:flex-end; }
    .bubble {
      position: relative;
      max-width: 72%;
      padding:10px 12px;
      border-radius:16px;
      background:#ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      color:var(--text);
    }
    /* 내 메시지: 베이지 말풍선 */
    .msg.me .bubble {
      background:var(--beige);
      color:var(--text);
      border:1px solid var(--beige-dark);
    }

    .content { white-space:pre-wrap; word-break:break-word; }
    .meta { font-size:11px; opacity:.6; margin-top:6px; text-align:right; }
    .msg.me .meta { opacity:.7; }

    /* 내 메시지 삭제 버튼(우측 상단 작은 X) */
    .msg.me .delete-btn{
      position:absolute; top:6px; right:6px;
      border:none; background:transparent; color:#888; font-size:12px; cursor:pointer;
      padding:2px 4px; border-radius:6px;
    }
    .msg.me .delete-btn:hover{ background:#0000000e; color:#444; }

    .input-row { display:flex; gap:8px; margin-top:12px; }
    input[type="text"] { flex:1; padding:12px; border:1px solid #ddd; border-radius:12px; }
    /* 전송 버튼도 베이지 */
    button.send { padding:12px 16px; border:none; border-radius:12px; background:var(--beige); color:var(--ink); cursor:pointer; }
    button.send:hover { background:var(--beige-dark); }
    button:disabled { background:#ccc; color:#666; cursor:not-allowed; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <div class="room">
        <span th:text="${'채팅방: ' + header.accommodationName}">채팅방: 숙소명</span>
        <span style="color:#8a7b70" th:text="${' / 호스트: ' + header.hostName}">/ 호스트: 홍길동</span>
      </div>
      <div class="you" th:text="${'나: ' + meName}">나: 사용자</div>
    </div>

    <!-- 서버가 내려준 전체 히스토리(시스템 메시지/삭제된 메시지 제외) -->
    <div id="messages" class="messages">
      <div th:each="m : ${history}"
           th:if="${!m.deleted and !(#strings.contains(m.content, '입장') or #strings.contains(m.content, '퇴장'))}"
           th:classappend="${m.senderId} == ${#strings.toString(meId)} ? ' me' : ''"
           class="msg"
           th:attr="data-id=${m.id}">
        <div class="bubble">
          <div class="content" th:text="${m.content}">내용</div>
          <div class="meta" th:attr="data-time=${m.sentAt}">오전 00:00</div>
          <!-- 내 메시지에만 삭제 버튼 -->
          <button class="delete-btn"
                  th:if="${m.senderId} == ${#strings.toString(meId)}"
                  title="삭제"
                  onclick="deleteMyMessage(this)">✕</button>
        </div>
      </div>
    </div>

    <div class="input-row">
      <input id="messageInput" type="text" placeholder="메시지를 입력하세요" />
      <button id="sendBtn" class="send" disabled>전송</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
/*<![CDATA[*/
  const roomId   = /*[[${roomId}]]*/ 'room-demo';
  const meId     = /*[[${meId}]]*/ 0;
  const meName   = /*[[${#strings.escapeJavaScript(meName)}]]*/ '게스트';
/*]]>*/
</script>

<script>
(function () {
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  let stompClient = null;

  // ---- 시간 포맷: '오전/오후 hh:mm' ----
  function formatKoreanTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const h = d.getHours();
    const m = d.getMinutes();
    const ampm = (h < 12) ? '오전' : '오후';
    const hh = ((h % 12) || 12).toString().padStart(2, '0');
    const mm = m.toString().padStart(2, '0');
    return `${ampm} ${hh}:${mm}`;
  }
  function hydrateTimes() {
    document.querySelectorAll('.meta[data-time]').forEach(el => {
      el.textContent = formatKoreanTime(el.getAttribute('data-time'));
    });
  }
  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function isSystemMessage(msg) {
    const t = (msg.type || '').toString().toUpperCase();
    if (t && t !== 'TALK') return true;
    const c = (msg.content || '');
    return /입장했|퇴장했/.test(c);
  }

  // 말풍선 DOM 추가
  function appendMessage(msg, mine = false) {
    if (isSystemMessage(msg) || msg.deleted) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'msg' + (mine ? ' me' : '');
    wrapper.setAttribute('data-id', msg.id);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const content = document.createElement('div');
    content.className = 'content';
    content.textContent = msg.content ?? '';

    const timeEl = document.createElement('div');
    timeEl.className = 'meta';
    timeEl.textContent = formatKoreanTime(msg.sentAt);

    bubble.appendChild(content);
    bubble.appendChild(timeEl);

    if (mine){
      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.title = '삭제';
      del.textContent = '✕';
      del.onclick = () => deleteMyMessage(del);
      bubble.appendChild(del);
    }

    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
  }

  // 삭제 버튼 클릭 → STOMP로 삭제 요청
  window.deleteMyMessage = function(btn){
    const msgEl = btn.closest('.msg');
    const messageId = msgEl?.getAttribute('data-id');
    if (!messageId) return;

    if (!confirm('이 메시지를 삭제할까요?')) return;

    const payload = { roomId, messageId: Number(messageId), requesterId: Number(meId) };
    stompClient.send('/app/chat.delete', {}, JSON.stringify(payload));
    // 낙관적 UI 제거(서버 브로드캐스트도 다시 옴)
    removeMessageById(messageId);
  }

  function removeMessageById(id){
    const el = messagesEl.querySelector(`.msg[data-id="${id}"]`);
    if (el) el.remove();
  }

  function connect() {
    const socket = new SockJS('/ws-stomp');
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {
      stompClient.subscribe('/topic/chat/' + roomId, function (frame) {
        const msg = JSON.parse(frame.body);

        if (msg.type === 'DELETED' && msg.messageId){
          removeMessageById(String(msg.messageId));
          return;
        }
        const mine = String(msg.senderId) === String(meId);
        appendMessage(msg, mine);
      });

      sendBtn.disabled = false;
    }, function (err) {
      console.error('STOMP 연결 실패', err);
      sendBtn.disabled = true;
    });
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !stompClient || !stompClient.connected) return;
    const payload = {
      roomId, senderId: String(meId), senderName: meName,
      type: 'TALK', content: text, sentAt: new Date().toISOString()
    };
    stompClient.send('/app/chat.send', {}, JSON.stringify(payload));
    inputEl.value = '';
    inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  hydrateTimes();
  scrollToBottom();
  connect();

  window.addEventListener('beforeunload', () => {
    try { stompClient && stompClient.disconnect(); } catch (_) {}
  });
})();
</script>
</body>
</html>
