<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accomm</title>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#fffdf9; }

        header {
            display:flex; justify-content:space-between; align-items:center;
            padding:16px 32px; background:#fefcf9; border-bottom:1px solid #eee;
        }
        .logo { font-size:24px; font-weight:bold; color:#a67c52; text-decoration:none; }
        nav { display:flex; align-items:center; gap:20px; }
        nav a { text-decoration:none; color:#5c3d2e; font-size:16px; }

        .user-menu-container { position:relative; display:inline-block; }
        .profile-button {
            background:#a67c52; color:#fff; border:none; border-radius:50%;
            width:40px; height:40px; font-size:18px; cursor:pointer;
        }
        .dropdown-menu {
            position:absolute; right:0; top:50px; background:#fff; border-radius:12px;
            box-shadow:0 4px 12px rgba(0,0,0,.1); width:200px; padding:12px 0; z-index:1000;
        }
        .dropdown-menu a { display:block; padding:10px 20px; color:#333; text-decoration:none; }
        .dropdown-menu a:hover { background:#f5f5f5; }

        .search-bar { display:flex; justify-content:center; margin:30px 0; gap:10px; }
        .search-bar input[type="text"],
        .search-bar input[type="date"] {
            height:40px; padding:0 14px; border:1px solid #e7dfd7; border-radius:10px; background:#fff; min-width:180px;
        }

        .search-btn {
            height:40px; padding:0 16px; border:0; border-radius:10px; cursor:pointer;
            background:#c1a78a; color:#fff; font-weight:700;
        }

        .accommodation-section { padding:24px; }
        .accommodation-section h2 { color:#5c3d2e; margin:0; }
        .card-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px; }
        .card {
            background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 0 10px rgba(0,0,0,.1);
            text-decoration:none; color:#000; transition:transform .2s ease;
        }
        .card:hover { transform:translateY(-4px); }
        .card img { width:100%; height:160px; object-fit:cover; }
        .card-body { padding:12px; }
        .card-title { font-size:16px; font-weight:bold; margin-bottom:4px; }
        .card-price { color:#5c3d2e; font-weight:600; margin-bottom:4px; }
        .card-location { font-size:13px; color:#888; }

        .pagination { display:flex; gap:8px; justify-content:center; margin:24px 0; }
        .pagination a { padding:6px 10px; border-radius:6px; text-decoration:none; color:#5c3d2e; border:1px solid #e8e0d6; }
        .pagination a.active { background:#a67c52; color:#fff; border-color:#a67c52; }
        .empty { color:#8a7b70; text-align:center; margin:16px 0; }

        .guest-picker{ position:relative; }
        .guest-display{
            height:40px; padding:0 14px; border:1px solid #e7dfd7; border-radius:10px;
            background:#fff; min-width:180px; cursor:pointer; color:#5c3d2e;
        }
        .guest-dropdown{
            position:absolute; top:48px; left:0; z-index:30; width:340px;
            background:#fff; border:1px solid #ecdacc; border-radius:14px;
            box-shadow:0 12px 28px rgba(0,0,0,.12); padding:14px; display:none;
        }
        .guest-dropdown.open{ display:block; }
    </style>
</head>
<body>

<header>
    <a href="/accommodations" class="logo">Accomm</a>

    <div class="user-menu-container" th:if="${session.loginUser != null}">
        <button onclick="toggleUserMenu()" class="profile-button"
                th:text="${session.loginUser.nickname != null 
                          ? #strings.substring(session.loginUser.nickname, 0, 1) 
                          : '유'}">
            유
        </button>

        <div id="userDropdown" class="dropdown-menu" style="display:none;">
            <a th:if="${session.loginUser.role == 'guest'}" href="/users/mypage">예약 내역</a>
            <a th:if="${session.loginUser.role == 'guest'}" href="/users/reviews">후기</a>
            <a th:if="${session.loginUser.role == 'guest'}" href="/users/wishlist">위시리스트</a>

            <a th:if="${session.loginUser.role == 'host'}" href="/host/mypage">숙소 관리</a>
            <a th:if="${session.loginUser.role == 'host'}" href="/host/reviews">후기</a>

            <a href="/chat/messages">메시지</a>
            <a href="/logout">로그아웃</a>
        </div>
    </div>

    <nav th:unless="${session.loginUser != null}">
        <a href="/login">로그인</a>
        <a href="/register">회원가입</a>
    </nav>
</header>

<!-- 🔥 검색바: action="/" → "/accommodations" -->
<form class="search-bar" action="/accommodations" method="get">
    <input type="text" name="location" placeholder="위치" th:value="${location}">
    <input type="date" name="checkIn" th:value="${checkIn}">
    <input type="date" name="checkOut" th:value="${checkOut}">

    <div class="guest-picker">
        <button type="button" id="guestToggle" class="guest-display">
            <span id="guestLabel" th:text="${guests != null ? '인원 ' + guests : '인원 1'}">인원 1</span>
        </button>
        <input type="hidden" name="guests" id="guestsInput" th:value="${guests != null ? guests : 1}">
    </div>

    <button type="submit" class="search-btn">검색</button>
</form>


<div class="accommodation-section">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>숙소 목록</h2>

        <!-- 🔥 정렬 action="/" → "/accommodations" -->
        <form method="get" action="/accommodations" style="display:flex; gap:10px; align-items:center;">
            <select name="sort"
                    style="padding:8px 12px; border-radius:8px; border:1px solid #ccc; font-size:14px;">
                <option value="recent" th:selected="${sort == 'recent'}">최신순</option>
                <option value="priceAsc" th:selected="${sort == 'priceAsc'}">가격 낮은순</option>
                <option value="priceDesc" th:selected="${sort == 'priceDesc'}">가격 높은순</option>
            </select>

            <input type="hidden" name="location" th:value="${location}">
            <input type="hidden" name="checkIn" th:value="${checkIn}">
            <input type="hidden" name="checkOut" th:value="${checkOut}">
            <input type="hidden" name="guests" th:value="${guests}">
            <input type="hidden" name="q" th:value="${q}">

            <button type="submit"
                    style="padding:8px 14px; background:#5c3d2e; color:#fff; border:none; border-radius:8px; cursor:pointer;">
                정렬
            </button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(accommodations)}" class="empty">
        조건에 맞는 숙소가 없습니다.
    </div>

    <div class="card-list" th:unless="${#lists.isEmpty(accommodations)}">
        <a class="card" th:each="a : ${accommodations}" th:href="@{/accommodations/{id}(id=${a.id})}">
            <img th:src="${a.thumbnailUrl != null ? a.thumbnailUrl : a.mainImageUrl}" alt="숙소 이미지">
            <div class="card-body">
                <div class="card-title" th:text="${a.name}"></div>
                <div class="card-price"
                     th:text="${a.price != null ? '₩' + #numbers.formatDecimal(a.price,0,'COMMA',0,'POINT') + ' /박' : '가격 정보 없음'}">
                </div>
                <div class="card-location" th:text="${@viewGlobals.region2(a.location)}"></div>
            </div>
        </a>
    </div>

    <div class="pagination" th:if="${result != null and result.totalPages > 1}">
        <a th:each="p : ${#numbers.sequence(0, result.totalPages-1)}"
           th:href="@{/accommodations(location=${location}, checkIn=${checkIn}, checkOut=${checkOut}, guests=${guests}, q=${q}, sort=${sort}, page=${p}, size=${result.size})}"
           th:text="${p + 1}"
           th:classappend="${p} == ${result.number} ? 'active' : ''">
        </a>
    </div>
</div>

<script>
    function toggleUserMenu() {
        const dropdown = document.getElementById("userDropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }
</script>

</body>
</html>
