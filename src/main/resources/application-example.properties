spring.application.name=accommodation-platform

# ✅ 로그
logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.boot.web.embedded.tomcat=DEBUG

# ✅ DB 설정
spring.datasource.url=jdbc:mysql://localhost:3306/example_db
spring.datasource.username=your_username
spring.datasource.password=your_password

# ✅ JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ✅ Thymeleaf 설정
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ✅ 서버 포트
server.port=8081

# ✅ Spring Boot 기본 multipart 사용 다시 활성화
spring.servlet.multipart.enabled=true

# 최대 파트 수 제한 해제
server.tomcat.max-part-count=1000

# 추가로 함께 설정하면 안정성 증가
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=500MB
server.tomcat.max-parameter-count=10000

